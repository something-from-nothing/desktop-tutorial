<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Desk Agent</title>
<!--
  Desk Agent Mobile: your own AI on your phone. Everything runs on the phone through
  the llama.cpp engine the app starts in the background. This page is the whole app:
  chats, projects, agents, the full screen view for finished work, models and memory.
  The Android side (MainActivity.java) only runs the engine, downloads models, stores
  files and fetches web pages for it, through window.Android.

  Look: a quiet, native feeling app. Warm off white with one deep green accent, plain
  line icons, replies as plain text, and every option tucked away until asked for.
-->
<style>
:root {
  --bg: #fafaf8; --surface: #ffffff; --raised: #f2f2ef; --text: #1d1d1f; --dim: #6e6e73; --faint: #a1a1a6;
  --line: #e7e7e3; --accent: #1f5f4a; --accent-text: #ffffff; --accent-soft: #e6efeb; --danger: #b3261e;
  --code: #f4f4f1; --radius: 16px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #121212; --surface: #1c1c1e; --raised: #26262a; --text: #ececee; --dim: #9a9aa0; --faint: #6c6c72;
          --line: #2e2e32; --accent: #8fd1b4; --accent-text: #0d2a20; --accent-soft: #1d2f28; --danger: #f2b8b5; --code: #1f1f22; color-scheme: dark; }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; font: 16px/1.6 Roboto, system-ui, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); display: flex; overflow: hidden;
       padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; border-radius: 999px; padding: 8px 16px; min-height: 40px; }
button.filled { background: var(--accent); color: var(--accent-text); font-weight: 500; }
button.tonal { background: var(--raised); }
button.text { color: var(--accent); font-weight: 500; }
button.danger { color: var(--danger); }
button:disabled { opacity: .45; }
.icon-btn { width: 44px; height: 44px; min-height: 44px; padding: 0; display: inline-flex; align-items: center; justify-content: center; color: var(--dim); flex-shrink: 0; }
.icon-btn:active, .row-btn:active { background: var(--raised); }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
input, select, textarea { font: inherit; color: var(--text); background: var(--raised); border: 1px solid transparent; border-radius: 12px; padding: 11px 13px; width: 100%; outline: none; }
input:focus, textarea:focus, select:focus { border-color: var(--accent); }
textarea { resize: vertical; }
a { color: var(--accent); text-decoration: none; }

/* ---- navigation drawer ---- */
#side { width: 300px; max-width: 84vw; background: var(--surface); display: flex; flex-direction: column; flex-shrink: 0; z-index: 30; border-right: 1px solid var(--line); }
@media (max-width: 899px) {
  #side { position: fixed; top: 0; bottom: 0; left: 0; transform: translateX(-102%); transition: transform .24s cubic-bezier(.2,.8,.2,1);
          padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); border-radius: 0 24px 24px 0; border: 0; }
  body.drawer #side { transform: none; box-shadow: 0 0 48px #0003; }
  body.drawer #shade { opacity: 1; pointer-events: auto; }
}
@media (min-width: 900px) { #menuBtn { visibility: hidden; } }
#shade { position: fixed; inset: 0; background: #0005; z-index: 25; opacity: 0; pointer-events: none; transition: opacity .24s; }
#side .head { padding: 20px 20px 8px; font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
.row-btn { display: flex; align-items: center; gap: 14px; width: calc(100% - 16px); margin: 0 8px; padding: 0 14px; min-height: 48px; border-radius: 999px; text-align: left; font-size: 15px; }
.row-btn.active { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.row-btn span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-btn .end { flex: none; color: var(--faint); display: none; }
.row-btn:hover .end, .row-btn.active .end { display: inline-flex; }
#side .search { margin: 4px 16px 8px; width: auto; }
#side .label { padding: 16px 22px 6px; font-size: 13px; color: var(--dim); display: flex; justify-content: space-between; align-items: center; }
#side .label button { padding: 0 6px; min-height: 28px; color: var(--accent); font-size: 13px; font-weight: 500; }
#side .scroll { flex: 1; overflow-y: auto; padding-bottom: 8px; }
#side .empty-note { padding: 4px 22px; color: var(--faint); font-size: 14px; }
#side .foot { border-top: 1px solid var(--line); padding: 6px 0 4px; }
#side .stats { font-size: 12px; color: var(--faint); padding: 6px 22px 10px; }

/* ---- main screen ---- */
#main { flex: 1; display: flex; flex-direction: column; min-width: 0; height: 100%; }
#top { display: flex; align-items: center; gap: 2px; padding: 4px 6px; min-height: 56px; }
#title { font-size: 17px; font-weight: 500; background: transparent; border: 0; padding: 8px 6px; flex: 1; min-width: 0; text-overflow: ellipsis; border-radius: 10px; }
#title:focus { background: var(--raised); }
#status { font-size: 13px; color: var(--dim); padding: 0 20px; min-height: 0; transition: min-height .2s; }
#status:not(:empty) { min-height: 22px; }

#chat { flex: 1; overflow-y: auto; padding: 4px 0 24px; -webkit-overflow-scrolling: touch; }
.msg { max-width: 760px; margin: 0 auto; padding: 0 20px; }
.msg + .msg { margin-top: 20px; }
.msg.user { display: flex; flex-direction: column; align-items: flex-end; }
.bubble { background: var(--raised); border-radius: 20px 20px 6px 20px; padding: 10px 16px; max-width: 85%; white-space: pre-wrap; word-wrap: break-word; }
.attached { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--dim); margin-top: 4px; }
.attached svg.i { width: 16px; height: 16px; }
.tools-row { display: flex; gap: 2px; margin-top: 2px; color: var(--faint); }
.tools-row .icon-btn { width: 36px; height: 36px; min-height: 36px; color: var(--faint); }
.tools-row svg.i { width: 18px; height: 18px; }
.msg.user .tools-row { visibility: hidden; }
.msg.user.show .tools-row { visibility: visible; }
.md { word-wrap: break-word; }
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.md p { margin: .6em 0; } .md h1, .md h2, .md h3 { margin: 1em 0 .3em; line-height: 1.3; font-weight: 600; } .md h1 { font-size: 1.25em; } .md h2 { font-size: 1.12em; } .md h3 { font-size: 1em; }
.md ul, .md ol { padding-left: 1.3em; margin: .5em 0; } .md li { margin: .2em 0; }
.md blockquote { border-left: 3px solid var(--line); margin: .6em 0; padding-left: 14px; color: var(--dim); }
.md table { border-collapse: collapse; margin: .8em 0; display: block; overflow-x: auto; font-size: 15px; }
.md th, .md td { border-bottom: 1px solid var(--line); padding: 6px 14px 6px 0; text-align: left; } .md th { font-weight: 600; }
.md code { background: var(--code); padding: 2px 5px; border-radius: 6px; font-family: "Roboto Mono", ui-monospace, monospace; font-size: .88em; }
.codeblock { background: var(--code); border-radius: 14px; margin: .8em 0; overflow: hidden; }
.codeblock .bar { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--dim); padding: 2px 4px 0 14px; }
.codeblock .bar button { font-size: 13px; color: var(--dim); min-height: 34px; padding: 4px 10px; }
.codeblock pre { margin: 0; padding: 4px 14px 14px; overflow-x: auto; font-size: 13px; line-height: 1.5; } .codeblock code { background: none; padding: 0; }

/* quiet one line steps: tool use, reasoning, helper agents */
details.step { margin: 6px 0; font-size: 14px; color: var(--dim); }
details.step > summary { list-style: none; display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 4px 0; min-height: 32px; }
details.step > summary::-webkit-details-marker { display: none; }
details.step > summary svg.i { width: 17px; height: 17px; }
details.step > summary .chev { margin-left: auto; transition: transform .2s; color: var(--faint); }
details.step[open] > summary .chev { transform: rotate(90deg); }
details.step > summary .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
details.step .detail { margin: 2px 0 8px 25px; padding-left: 12px; border-left: 2px solid var(--line); white-space: pre-wrap; font-size: 13px; max-height: 260px; overflow: auto; }
details.step .detail.md { white-space: normal; font-size: 14px; color: var(--text); }
.live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); display: inline-block; animation: pulse 1.2s ease-in-out infinite; flex-shrink: 0; margin: 0 5px; }
@keyframes pulse { 50% { opacity: .25; } }
.cursor::after { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-left: 4px; animation: pulse 1.2s infinite; vertical-align: middle; }

.artifact { display: flex; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; margin: 10px 0; cursor: pointer; width: 100%; text-align: left; min-height: 64px; }
.artifact .badge { width: 40px; height: 40px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.artifact b { display: block; font-weight: 500; } .artifact small { color: var(--dim); font-size: 13px; }
.artifact .chev { margin-left: auto; color: var(--faint); }
.note { color: var(--danger); font-size: 14px; }

#empty { max-width: 420px; margin: 18vh auto 0; text-align: center; padding: 0 28px; color: var(--dim); }
#empty .mark { width: 52px; height: 52px; border-radius: 16px; background: var(--accent-soft); color: var(--accent); display: inline-flex; align-items: center; justify-content: center; }
#empty .mark svg.i { width: 26px; height: 26px; }
#empty h1 { font-size: 22px; font-weight: 500; color: var(--text); margin: 18px 0 6px; letter-spacing: -.01em; }
#empty p { margin: 0 0 20px; font-size: 15px; }

/* ---- message bar ---- */
#composer { width: 100%; max-width: 800px; margin: 0 auto; padding: 0 12px 12px; }
#mode { display: block; margin: 0 auto 6px; font-size: 13px; color: var(--dim); min-height: 30px; padding: 4px 12px; }
#mode:empty { display: none; }
#attachments { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 4px 6px; }
#attachments .file { display: inline-flex; align-items: center; gap: 6px; background: var(--raised); border-radius: 10px; padding: 4px 4px 4px 10px; font-size: 13px; }
#attachments .file button { min-height: 28px; padding: 0 6px; color: var(--dim); }
#composer .box { background: var(--surface); border: 1px solid var(--line); border-radius: 28px; padding: 4px; display: flex; align-items: flex-end; gap: 2px; }
#composer textarea { flex: 1; border: 0; background: transparent; resize: none; min-height: 44px; max-height: 180px; padding: 11px 4px; border-radius: 0; }
#composer textarea:focus { border: 0; }
#sendBtn, #stopBtn { width: 44px; height: 44px; min-height: 44px; padding: 0; display: inline-flex; align-items: center; justify-content: center; background: var(--accent); color: var(--accent-text); flex-shrink: 0; }
#sendBtn:disabled { background: var(--raised); color: var(--faint); opacity: 1; }
#stopBtn { background: var(--text); color: var(--bg); }

/* ---- full screen view for finished work ---- */
#panel { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: none; flex-direction: column; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
#panel.open { display: flex; }
#panel .bar { display: flex; align-items: center; gap: 2px; padding: 4px 6px; min-height: 56px; }
#panel .bar b { flex: 1; font-weight: 500; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 4px; }
.seg { display: inline-flex; background: var(--raised); border-radius: 999px; padding: 3px; margin: 0 6px; }
.seg button { min-height: 32px; padding: 4px 14px; font-size: 14px; color: var(--dim); }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px #0002; }
#panel .body { flex: 1; overflow: auto; border-top: 1px solid var(--line); }
#panel iframe { width: 100%; height: 100%; border: 0; background: #fff; }
#panel .md { padding: 18px 20px; }

/* ---- bottom sheets ---- */
.sheet-bg { position: fixed; inset: 0; background: #0005; display: flex; align-items: flex-end; justify-content: center; z-index: 50; animation: fade .18s; }
.sheet { background: var(--surface); border-radius: 28px 28px 0 0; width: min(640px, 100vw); max-height: 88vh; overflow: auto; padding: 8px 20px calc(16px + env(safe-area-inset-bottom)); animation: rise .22s cubic-bezier(.2,.8,.2,1); }
@media (min-width: 700px) { .sheet-bg { align-items: center; } .sheet { border-radius: 28px; } }
@keyframes fade { from { opacity: 0; } } @keyframes rise { from { transform: translateY(40px); opacity: .6; } }
.sheet .grab { width: 32px; height: 4px; border-radius: 2px; background: var(--line); margin: 6px auto 14px; }
.sheet h2 { margin: 0 0 4px; font-size: 22px; font-weight: 500; letter-spacing: -.01em; }
.sheet .sub { color: var(--dim); margin: 0 0 14px; font-size: 14px; }
.sheet h3 { font-size: 13px; color: var(--dim); font-weight: 500; margin: 18px 0 6px; }
.sheet .field { margin: 14px 0; } .sheet .field > label { display: block; font-size: 13px; color: var(--dim); margin-bottom: 6px; }
.sheet .buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
.sheet .buttons .left { margin-right: auto; }
.list { border-radius: 16px; background: var(--raised); overflow: hidden; }
.list .item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; min-height: 56px; width: 100%; text-align: left; border-radius: 0; }
.list .item + .item { border-top: 1px solid var(--line); }
.list .item .grow { flex: 1; min-width: 0; }
.list .item .grow small { display: block; color: var(--dim); font-size: 13px; line-height: 1.4; margin-top: 1px; }
.list .item .tick { color: var(--accent); visibility: hidden; }
.list .item.on .tick { visibility: visible; }
.list .item .meta { font-size: 13px; color: var(--dim); white-space: nowrap; }
.list .item .actions { display: flex; gap: 4px; flex-shrink: 0; }
.list .item .actions button { min-height: 34px; padding: 4px 12px; font-size: 14px; }
.ready { color: var(--accent); font-size: 13px; font-weight: 500; }
.progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 8px; } .progress div { height: 100%; background: var(--accent); transition: width .4s; }
.switch { position: relative; width: 52px; height: 32px; flex-shrink: 0; }
.switch input { opacity: 0; position: absolute; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; border-radius: 16px; background: var(--line); transition: background .2s; }
.switch span::after { content: ""; position: absolute; left: 4px; top: 4px; width: 24px; height: 24px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px #0003; transition: transform .2s; }
.switch input:checked + span { background: var(--accent); } .switch input:checked + span::after { transform: translateX(20px); }
.files { display: flex; flex-wrap: wrap; gap: 6px; }
.files .file { display: inline-flex; align-items: center; gap: 4px; background: var(--raised); border-radius: 10px; padding: 4px 4px 4px 10px; font-size: 13px; }
.files .file button { min-height: 28px; padding: 0 6px; color: var(--dim); }
#toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 12px; font-size: 14px; z-index: 60; max-width: 88vw; opacity: 0; pointer-events: none; transition: opacity .2s; }
#toast.on { opacity: 1; }
</style>
</head>
<body>
<div id="shade" onclick="closeDrawer()"></div>
<nav id="side">
  <div class="head">Desk Agent</div>
  <button class="row-btn" onclick="newChat()"><svg class="i"><use href="#i-compose"/></svg><span>New chat</span></button>
  <input class="search" id="search" placeholder="Search" oninput="renderSide()">
  <div class="scroll">
    <div class="label">Projects <button onclick="editProject()" aria-label="New project">New</button></div>
    <div id="projects"></div>
    <div class="label"><span id="chatsLabel">Recent</span></div>
    <div id="chats"></div>
  </div>
  <div class="foot">
    <button class="row-btn" onclick="closeDrawer(); showAgents()"><svg class="i"><use href="#i-people"/></svg><span>Agents</span></button>
    <button class="row-btn" onclick="closeDrawer(); showModels()"><svg class="i"><use href="#i-chip"/></svg><span>Models</span></button>
    <button class="row-btn" onclick="closeDrawer(); showSchedules()"><svg class="i"><use href="#i-clock"/></svg><span>Scheduled</span></button>
    <button class="row-btn" onclick="closeDrawer(); showMemory()"><svg class="i"><use href="#i-book"/></svg><span>Memory</span></button>
    <button class="row-btn" onclick="closeDrawer(); showSettings()"><svg class="i"><use href="#i-gear"/></svg><span>Settings</span></button>
    <div class="stats" id="stats"></div>
  </div>
</nav>

<main id="main">
  <div id="top">
    <button class="icon-btn" id="menuBtn" onclick="openDrawer()" aria-label="Menu"><svg class="i"><use href="#i-menu"/></svg></button>
    <input id="title" value="New chat" onchange="renameChat(this.value)" aria-label="Chat title">
    <button class="icon-btn" onclick="newChat()" aria-label="New chat"><svg class="i"><use href="#i-compose"/></svg></button>
  </div>
  <div id="status"></div>
  <div id="chat"></div>
  <div id="composer">
    <button id="mode" onclick="showOptions()"></button>
    <div id="attachments"></div>
    <div class="box">
      <button class="icon-btn" onclick="document.getElementById('file').click()" aria-label="Attach a file"><svg class="i"><use href="#i-clip"/></svg></button>
      <input type="file" id="file" multiple hidden onchange="attach(this.files)">
      <textarea id="input" rows="1" placeholder="Message" onkeydown="keydown(event)" oninput="autosize()"></textarea>
      <button class="icon-btn" onclick="showOptions()" aria-label="Options"><svg class="i"><use href="#i-tune"/></svg></button>
      <button id="stopBtn" onclick="stopJob()" hidden aria-label="Stop"><svg class="i" style="width:16px;height:16px"><use href="#i-stop"/></svg></button>
      <button id="sendBtn" onclick="send()" aria-label="Send"><svg class="i"><use href="#i-send"/></svg></button>
    </div>
  </div>
</main>

<aside id="panel">
  <div class="bar">
    <button class="icon-btn" onclick="closePanel()" aria-label="Close"><svg class="i"><use href="#i-close"/></svg></button>
    <b id="artTitle"></b>
    <span class="seg"><button id="tabPreview" onclick="artTab('preview')">Preview</button><button id="tabCode" onclick="artTab('code')">Code</button></span>
    <button class="icon-btn" onclick="copyText(currentArt.content)" aria-label="Copy"><svg class="i"><use href="#i-copy"/></svg></button>
    <button class="icon-btn" onclick="saveArt()" aria-label="Save to Downloads"><svg class="i"><use href="#i-save"/></svg></button>
  </div>
  <div class="body" id="artBody"></div>
</aside>
<div id="toast"></div>

<!-- Line icons, drawn once and reused. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></symbol>
  <symbol id="i-compose" viewBox="0 0 24 24"><path d="M12 20h8"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></symbol>
  <symbol id="i-clip" viewBox="0 0 24 24"><path d="M21 11.5l-8.6 8.6a5 5 0 0 1-7-7l8.6-8.6a3.3 3.3 0 0 1 4.7 4.7l-8.6 8.6a1.7 1.7 0 0 1-2.4-2.4l7.9-7.9"/></symbol>
  <symbol id="i-tune" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></symbol>
  <symbol id="i-save" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
  <symbol id="i-redo" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-doc" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></symbol>

const DEFAULT_SETTINGS = {model: "auto", style: "normal", think: false, context: 8192, learn: true, max_steps: 12};
const CODE_WORDS = /\b(code|coding|program|script|python|javascript|html|css|function|bug|debug|compile|app|website|game|sql|class|error|traceback|refactor|api)\b/i;

// ================================================================ the bridge to Android

// In the app, window.Android is the Java bridge. Opened in a normal browser (for
// testing), a stand in keeps data in localStorage and talks to a llama-server whose
// port is given as ?engine=PORT.
const pending = {}; let seq = 0;

window.__bridgeEvent = raw => onBridgeEvent(JSON.parse(raw));
const B = window.Android || (() => {
  const enginePort = +(new URLSearchParams(location.search).get("engine") || 0);
  const ls = k => localStorage.getItem("da:" + k);
  return {
    read: p => ls(p), write: (p, t) => (localStorage.setItem("da:" + p, t), true),
    list: dir => JSON.stringify(Object.keys(localStorage).filter(k => k.startsWith("da:" + dir + "/")).map(k => k.slice(dir.length + 4))),
    remove: p => (localStorage.removeItem("da:" + p), true),
    models: () => ls("_models") || "{}", deleteModel: k => { const m = JSON.parse(ls("_models") || "{}"); delete m[k]; localStorage.setItem("da:_models", JSON.stringify(m)); return true; },
    cancelDownload: () => {}, freeSpace: () => 64e9, memory: () => 12e9, loaded: () => null,
    isBackground: () => false, phoneEnabled: () => localStorage.getItem("da:_phone") === "on", openPhoneSettings: () => localStorage.setItem("da:_phone", "on"),
    keepAlive: () => {}, bringToFront: () => {}, openWebsite: k => { window.__opened = k; }, exactAlarmsAllowed: () => true, openAlarmSettings: () => {}, notificationsAllowed: () => true,
    askForNotifications: () => {}, schedulesChanged: () => { window.__schedulesChanged = (window.__schedulesChanged || 0) + 1; },
    scheduledDone: (chatId, title, text) => { window.__scheduledDone = {chatId, title, text}; },
    call: async (id, method, args) => {
      const a = JSON.parse(args), reply = (value, error) => setTimeout(() => window.__bridgeReply(JSON.stringify({id, value, error})), 10);
      try {
        if (method === "startEngine") return reply(enginePort);
        if (method === "httpGet") return reply(await (await fetch(a.url)).text());
        if (method === "saveDownload") return reply("Downloads/" + a.name);
        if (method === "phoneRead") return reply("App on screen: Notes\n[1] button \"New note\"\n[2] text field hint \"Title\"");
        if (method.startsWith("phone")) return reply(`${method} ok`);
        if (method === "download") { reply(true); const m = JSON.parse(ls("_models") || "{}"); m[a.key] = 1e9; localStorage.setItem("da:_models", JSON.stringify(m));
          setTimeout(() => window.__bridgeEvent(JSON.stringify({type: "download", key: a.key, done: 1e9, total: 1e9, status: "done"})), 300); return; }
        reply(true);

    },

})();
function bridge(method, args) {
  return new Promise((resolve, reject) => { const id = "r" + (++seq); pending[id] = {resolve, reject}; B.call(id, method, JSON.stringify(args || {})); });
}

// ================================================================ saved data

const readJSON = (path, fallback) => { try { const t = B.read(path); return t ? JSON.parse(t) : fallback; } catch (e) { return fallback; } };

let settings = {...DEFAULT_SETTINGS, ...readJSON("settings.json", {})};
function saveSettings(changes) { Object.assign(settings, changes); writeJSON("settings.json", settings); }
function customAgents() { return readJSON("agents.json", {}); }
function allAgents() { return {...BUILTIN_AGENTS, ...customAgents()}; }
function readMemory() { return (B.read("memory.txt") || "").trim(); }
function stats() { return readJSON("stats.json", {first_used: now().slice(0, 10), jobs: 0, words_written: 0, models: {}}); }
function bumpStats(fn) { const s = stats(); fn(s); writeJSON("stats.json", s); }
function installed() {
  const files = JSON.parse(B.models() || "{}");
  return Object.keys(CATALOG).filter(k => files[k]);
}

const Store = {
  listChats() {
    return JSON.parse(B.list("chats")).map(n => readJSON("chats/" + n, null)).filter(Boolean)
      .map(c => ({id: c.id, title: c.title, project: c.project, agent: c.agent, updated: c.updated}))
      .sort((a, b) => (b.updated || "").localeCompare(a.updated || ""));
  },
  getChat: id => readJSON(`chats/${id}.json`, null),
  saveChat(c) { c.updated = now(); writeJSON(`chats/${c.id}.json`, c); },
  newChat(project, agent) { const c = {id: uid(), title: "New chat", project: project || null, agent: agent || "assistant", created: now(), messages: [], artifacts: []}; this.saveChat(c); return c; },
  deleteChat: id => B.remove(`chats/${id}.json`),
  listProjects() { return JSON.parse(B.list("projects")).map(n => readJSON("projects/" + n, null)).filter(Boolean).sort((a, b) => a.name.localeCompare(b.name)); },
  getProject: id => id ? readJSON(`projects/${id}.json`, null) : null,
  saveProject: p => writeJSON(`projects/${p.id}.json`, p),
  deleteProject(id) { B.remove(`projects/${id}.json`); for (const c of this.listChats()) if (c.project === id) { const full = this.getChat(c.id); full.project = null; this.saveChat(full); } },
};

// ================================================================ the AI engine

let enginePort = 0, engineModel = null;
async function loadModel(key) {
  if (engineModel === key && enginePort) return enginePort;
  setStatus(`Loading the ${CATALOG[key]?.label || key} model...`);
  enginePort = await bridge("startEngine", {model: key, context: settings.context});
  engineModel = key;
  return enginePort;
}

// Streams one reply from the engine's OpenAI style chat API on 127.0.0.1.
async function engineChat(messages, {tools, onText, signal, maxTokens = 2048} = {}) {
  const body = {messages, stream: true, max_tokens: maxTokens, temperature: 0.4};
  if (tools && tools.length) body.tools = tools;
  const res = await fetch(`http://127.0.0.1:${enginePort}/v1/chat/completions`,
    {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body), signal});
  if (!res.ok) throw new Error(`The AI engine said: ${(await res.text()).slice(0, 300)}`);
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = "", content = "", finish = null; const calls = {};
  for (;;) {
    let chunk;
    try { chunk = await reader.read(); } catch (e) { if (signal && signal.aborted) { finish = "stopped"; break; } throw e; }
    if (chunk.done) break;
    buf += dec.decode(chunk.value, {stream: true});
    let nl;
    while ((nl = buf.indexOf("\n")) >= 0) {
      const line = buf.slice(0, nl).trim(); buf = buf.slice(nl + 1);
      if (!line.startsWith("data:")) continue;
      const data = line.slice(5).trim();
      if (data === "[DONE]") continue;
      const choice = JSON.parse(data).choices[0], delta = choice.delta || {};
      if (delta.content) { content += delta.content; onText && onText(delta.content); }
      for (const tc of delta.tool_calls || []) {
        const slot = calls[tc.index || 0] ||= {id: "", name: "", arguments: ""};
        slot.id = tc.id || slot.id;
        slot.name += tc.function?.name || ""; slot.arguments += tc.function?.arguments || "";
      }
      finish = choice.finish_reason || finish;
    }
  }
  const thoughts = [...content.matchAll(/<think>([\s\S]*?)(?:<\/think>|$)/g)].map(m => m[1].trim()).join("\n");
  const message = {role: "assistant", content: content.replace(/<think>[\s\S]*?(<\/think>|$)/g, "").trim()};
  if (thoughts) message.thinking = thoughts;
  const list = Object.keys(calls).sort((a, b) => a - b).map(k => calls[k]);
  if (list.length) message.tool_calls = list.map(c => ({id: c.id || "call_" + uid(), type: "function", function: {name: c.name, arguments: c.arguments || "{}"}}));
  return {message, finish};
}

// ================================================================ tools

const tool = (name, description, properties, required) => ({type: "function", function: {name, description, parameters: {type: "object", properties, required}}});
const TOOL_GROUPS = {
  web: [
    tool("web_search", "Search the web and get the top results with links.", {query: {type: "string"}}, ["query"]),
    tool("read_webpage", "Fetch a web page and return its text.", {url: {type: "string"}}, ["url"]),
  ],
  artifacts: [
    tool("create_artifact", "Show the user a finished piece of work full screen: a web page or small app (html), a drawing (svg), a document (markdown) or a code file (code). Send the complete content. Use the same title again to update it.",
      {title: {type: "string"}, kind: {type: "string", enum: ["html", "svg", "markdown", "code"]}, language: {type: "string"}, content: {type: "string"}}, ["title", "kind", "content"]),
  ],
  phone: [
    tool("read_screen", "See what is on the phone's screen now, as a numbered list of buttons, text fields and text.", {}, []),
    tool("open_app", "Open an installed app by its name, for example Gmail, Maps or Settings.", {name: {type: "string"}}, ["name"]),
    tool("tap", "Tap an item on screen by its number from the latest read_screen.", {item: {type: "integer"}}, ["item"]),
    tool("type_text", "Type into a text field, by its number from read_screen. Leave out item to type into the field that is already selected.", {text: {type: "string"}, item: {type: "integer"}}, ["text"]),
    tool("scroll", "Scroll the screen or a list up or down.", {direction: {type: "string", enum: ["up", "down"]}, item: {type: "integer"}}, ["direction"]),
    tool("press", "Press one of the phone's own buttons.", {button: {type: "string", enum: ["back", "home", "recents", "notifications"]}}, ["button"]),
    tool("list_apps", "List the names of the apps installed on the phone.", {}, []),
  ],
  delegate: [
    tool("ask_agent", "Hand a self contained task to a specialist agent and get its answer back. Describe the task fully; the agent can't see this chat.",
      {agent: {type: "string", description: "Agent id"}, task: {type: "string"}}, ["agent", "task"]),
  ],
};
const GROUP_PROMPTS = {
  web: "You can search the web and read pages. Say where information came from.",
  artifacts: "Use create_artifact to show finished web pages, drawings, documents or code to the user.",
  delegate: "Agents you can hand work to with ask_agent: {agents}.",
  phone: "You can use the phone's apps with read_screen, open_app, tap, type_text, scroll, press and list_apps.",
};

function pageText(raw) {
  const doc = new DOMParser().parseFromString(raw, "text/html");
  doc.querySelectorAll("script,style,noscript,svg,head,nav,footer").forEach(n => n.remove());
  return (doc.body?.innerText || doc.body?.textContent || "").replace(/[ \t]+/g, " ").replace(/\n\s*\n+/g, "\n\n").trim();
}
async function webSearch(query) {
  const page = await bridge("httpGet", {url: "https://html.duckduckgo.com/html/?q=" + encodeURIComponent(query)});
  const doc = new DOMParser().parseFromString(page, "text/html");
  const out = [...doc.querySelectorAll("a.result__a")].slice(0, 8).map(a => {
    let link = a.getAttribute("href") || "";
    try { link = new URL(link, "https://duckduckgo.com").searchParams.get("uddg") || link; } catch (e) {}
    return `${a.textContent.trim()}\n${link}`;
  });
  return out.join("\n\n") || "No results.";
}

// ================================================================ the agent

const BASE_PROMPT = `You are {agent_name}, part of Desk Agent, an assistant running entirely on the user's own phone. Nothing they say leaves the phone, apart from web searches.
Today is {today}.

{instructions}

{tools}Use a tool whenever it helps, one step at a time, and look at each result before the next step.
Write in plain language and keep it readable on a phone screen. Use markdown for structure when it helps: headings, lists, tables and fenced code blocks with the language named.`;
const THINK_PROMPT = "Before answering, think the problem through step by step inside <think></think> tags, then give your answer after the closing tag.";
const LEARN_PROMPT = `You keep a short memory file about one user of an assistant app, so it gets more useful over time.

Current memory:
<memory>
{memory}
</memory>

A conversation that just finished:
<conversation>
{transcript}
</conversation>

Rewrite the memory to include anything new and lasting worth knowing next time: who they are, their work, preferences, interests, how they like things done, and jobs they repeat.
Leave out one off details, and anything secret such as passwords or card numbers.
Reply with only the new memory as short bullet points, under 300 words. If nothing new was learned, reply with the memory unchanged.`;

let job = null;  // {chatId, controller}

function toolsFor(agent, allowDelegate = true) {
  return (agent.tools || []).filter(g => g !== "delegate" || allowDelegate).flatMap(g => TOOL_GROUPS[g] || []);
}
function systemPrompt(agentId, agent, c, {style = "normal", think = false, allowDelegate = true} = {}) {
  const others = Object.entries(allAgents()).filter(([k]) => k !== agentId).map(([k, a]) => `${k} (${a.name})`).join(", ");
  const parts = (agent.tools || []).filter(g => GROUP_PROMPTS[g] && (g !== "delegate" || allowDelegate)).map(g => GROUP_PROMPTS[g].replace("{agents}", others));
  let p = BASE_PROMPT.replace("{agent_name}", agent.name).replace("{today}", new Date().toLocaleDateString("en-GB", {weekday: "long", day: "numeric", month: "long", year: "numeric"}))
    .replace("{instructions}", agent.instructions || "").replace("{tools}", parts.length ? parts.join("\n") + "\n" : "");
  if (STYLES[style]) p += "\n\nStyle: " + STYLES[style];
  if (think) p += "\n\n" + THINK_PROMPT;
  const proj = c && Store.getProject(c.project);
  if (proj) {
    p += `\n\nThis chat is part of the project "${proj.name}".`;
    if (proj.instructions) p += `\nProject instructions:\n${proj.instructions}`;
    let budget = Math.floor(settings.context * 1.5);
    for (const f of proj.files || []) { if (budget <= 0) break; const t = f.text.slice(0, budget); budget -= t.length; p += `\n\n<project_file name="${f.name}">\n${t}\n</project_file>`; }
  }
  const memory = settings.learn ? readMemory() : "";
  if (memory) p += `\n\nWhat you have learned about this user from earlier conversations:\n${memory}`;
  return p;
}
// The conversation as the model sees it, trimmed from the oldest end to fit.
function modelMessages(messages, system) {
  const out = messages.map(m => {
    const m2 = {role: m.role, content: m.content || ""};
    if (m.tool_calls) m2.tool_calls = m.tool_calls;
    if (m.tool_call_id) m2.tool_call_id = m.tool_call_id;
    if (m.role === "user" && m.attachments?.length) m2.content += m.attachments.map(a => `\n\n<attached_file name="${a.name}">\n${a.text}\n</attached_file>`).join("");
    return m2;
  });
  const budget = Math.floor(settings.context * 2.6) - system.length;
  let total = 0, start = out.length;
  while (start > 0 && total + JSON.stringify(out[start - 1]).length < budget) total += JSON.stringify(out[--start]).length;
  start = Math.min(start, out.length - 1);
  while (start > 0 && out[start].role === "tool") start--;
  return [{role: "system", content: system}, ...out.slice(start)];
}
function chooseModel(agent, text, first) {
  const ready = installed();
  if (!ready.length) throw new Error("No AI model is downloaded yet. Open Models to get one.");
  const wanted = settings.model !== "auto" ? settings.model : agent.model || "auto";
  if (wanted !== "auto") return ready.includes(wanted) ? [wanted, null] : [ready.includes("general") ? "general" : ready[0], `${wanted} isn't downloaded`];
  if (CODE_WORDS.test(text) && ready.includes("coder")) return ["coder", "it looks like a coding job"];
  if (first && text.split(/\s+/).length < 12 && !ACTION_WORDS.test(text) && ready.includes("quick")) return ["quick", "it's a short question"];
  return [ready.includes("general") ? "general" : ready[0], null];
}

async function startJob(c, body) {
  if (job) throw new Error("Already working on something. Wait for it to finish or press Stop.");
  if (body.regenerate) {
    while (c.messages.length && c.messages[c.messages.length - 1].role !== "user") c.messages.pop();
    if (!c.messages.length) throw new Error("Nothing to regenerate.");
  } else {
    if (body.edit_index !== undefined) c.messages.splice(body.edit_index);
    const m = {role: "user", content: (body.text || "").trim(), attachments: body.attachments || []};
    if (!m.content && !m.attachments.length) throw new Error("Type a message first.");
    c.messages.push(m);
    if (c.title === "New chat") c.title = (m.content.split(/\s+/).slice(0, 7).join(" ") || m.attachments[0].name).slice(0, 60);
  }
  Store.saveChat(c);
  job = {chatId: c.id, controller: new AbortController()};
  runJob(c, body);
}

async function runJob(c, body) {
  let model = null;
  try {
    const agentId = c.agent || "assistant", agent = allAgents()[agentId] || BUILTIN_AGENTS.assistant;
    const lastUser = [...c.messages].reverse().find(m => m.role === "user");
    const [m, reason] = chooseModel(agent, lastUser.content || "", c.messages.filter(x => x.role === "user").length === 1);
    model = m;
    if (reason) emit({type: "status", chat: c.id, text: `Using ${CATALOG[m]?.label || m} because ${reason}`});
    await loadModel(m);
    const system = systemPrompt(agentId, agent, c, {style: body.style, think: body.think});
    await agentLoop(c, c.messages, system, toolsFor(agent), null);
  } catch (e) {
    if (!(job && job.controller.signal.aborted)) emit({type: "error", chat: c.id, text: e.message || String(e)});
  } finally {
    const stopped = job && job.controller.signal.aborted;
    Store.saveChat(c);
    job = null;
    emit({type: "done", chat: c.id});
    if (model) afterJob(c, model, stopped);
    onJobDone(c, stopped);
  }
}

// One agent working until it answers. sub is the ask_agent call id for helper agents.
async function agentLoop(c, messages, system, tools, sub) {
  const steps = sub ? 8 : settings.max_steps;
  for (let i = 0; i < steps; i++) {
    if (job.controller.signal.aborted) return "Stopped by the user.";
    emit({type: "assistant_start", chat: c.id, sub});
    const {message, finish} = await engineChat(modelMessages(messages, system),
      {tools: CATALOG[engineModel]?.tools === false ? [] : tools, signal: job.controller.signal, onText: t => emit({type: "token", chat: c.id, sub, text: t})});
    messages.push(message);
    bumpStats(s => s.words_written = (s.words_written || 0) + (message.content || "").split(/\s+/).filter(Boolean).length);
    if (!sub) Store.saveChat(c);
    emit({type: "assistant_end", chat: c.id, sub, message});
    const calls = message.tool_calls || [];
    if (!calls.length) {
      if (finish === "length") emit({type: "error", chat: c.id, text: "The reply was cut off. Say 'continue' for the rest."});
      return message.content || "";
    }
    for (const call of calls) {
      const [result, extra] = await runTool(c, call, sub);
      messages.push({role: "tool", tool_call_id: call.id, content: result, ...extra});
      if (!sub) Store.saveChat(c);
    }
  }
  return "Stopped: too many steps.";
}

async function runTool(c, call, sub) {
  const name = call.function.name;
  let args;
  try { args = JSON.parse(call.function.arguments || "{}"); } catch (e) { return [`ERROR: the arguments were not valid JSON: ${call.function.arguments.slice(0, 400)}`, {}]; }
  const def = Object.values(TOOL_GROUPS).flat().find(t => t.function.name === name);
  if (!def) return [`ERROR: there is no tool called ${name}.`, {}];
  const props = def.function.parameters.properties;
  const missing = def.function.parameters.required.filter(k => args[k] === undefined || args[k] === "" || (props[k].type === "integer" && !Number.isInteger(+args[k])));
  if (missing.length) return [`ERROR: missing ${missing.join(", ")}.`, {}];
  emit({type: "tool_call", chat: c.id, sub, id: call.id, name, args});
  let result, extra = {};
  try {
    if (name === "web_search") result = await webSearch(args.query);
    else if (name === "read_webpage") result = pageText(await bridge("httpGet", {url: args.url}));
    else if (name === "create_artifact") [result, extra] = makeArtifact(c, args);
    else if (name === "ask_agent") [result, extra] = await askAgent(c, call.id, args);
    else if (PHONE_TOOLS[name]) result = await phoneTool(c, name, args);
  } catch (e) { result = `ERROR: ${e.message || e}`; }
  if (result.length > 6000) result = result.slice(0, 4000) + "\n...(cut)...\n" + result.slice(-1500);
  emit({type: "tool_result", chat: c.id, sub, id: call.id, name, result: result.slice(0, 3000)});
  return [result, extra];
}
function makeArtifact(c, a) {
  c.artifacts ||= [];
  const old = c.artifacts.find(x => x.title === a.title);
  const art = {id: old ? old.id : uid(), title: a.title, kind: a.kind, language: a.language || "", content: a.content, version: old ? old.version + 1 : 1};
  if (old) c.artifacts[c.artifacts.indexOf(old)] = art; else c.artifacts.push(art);
  emit({type: "artifact", chat: c.id, artifact: art});
  return [`Shown to the user as '${a.title}' (version ${art.version}).`, {artifact: art.id}];
}
async function askAgent(c, callId, a) {
  const agents = allAgents();
  let id = a.agent.trim().toLowerCase();
  if (!agents[id]) id = Object.keys(agents).find(k => agents[k].name.toLowerCase() === id);
  if (!id) return [`ERROR: no agent called ${a.agent}. Choose from: ${Object.keys(agents).join(", ")}.`, {}];
  const agent = agents[id];
  emit({type: "agent_start", chat: c.id, id: callId, agent: agent.name});
  const messages = [{role: "user", content: a.task}];
  const answer = await agentLoop(c, messages, systemPrompt(id, agent, c, {allowDelegate: false}), toolsFor(agent, false), callId);
  emit({type: "agent_end", chat: c.id, id: callId});
  const log = messages.slice(1).map(m => ({role: m.role, content: (m.content || "").slice(0, 3000), tools: (m.tool_calls || []).map(t => t.function.name)}));
  return [`${agent.name} replied:\n${answer}`, {agent: agent.name, agent_log: log}];
}

function afterJob(c, model, stopped) {
  bumpStats(s => { s.jobs = (s.jobs || 0) + 1; s.models = s.models || {}; s.models[model] = (s.models[model] || 0) + 1; s.last_used = now(); });
  renderStats();
  if (!settings.learn || stopped) return;
  const lines = c.messages.slice(-30).filter(m => (m.role === "user" || m.role === "assistant") && m.content).map(m => `${m.role === "user" ? "User" : "Assistant"}: ${m.content}`);
  const prompt = LEARN_PROMPT.replace("{memory}", readMemory() || "(empty)").replace("{transcript}", lines.join("\n").slice(-12000));
  engineChat([{role: "user", content: prompt}], {maxTokens: 700}).then(({message, finish}) => {
    if (finish === "stop" && message.content) B.write("memory.txt", message.content.trim() + "\n");
  }).catch(() => {});
}

function md(src) {
  const blocks = [];
  src = String(src || "").replace(/```([\w+-]*)[^\n]*\n([\s\S]*?)(```|$)/g, (_, lang, code) => { blocks.push({lang, code: code.replace(/\n$/, "")}); return `\u0000${blocks.length - 1}\u0000`; });
  const inline = t => esc(t)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<i>$2</i>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2">$1</a>')
    .replace(/(^|\s)(https?:\/\/[^\s<]+)/g, '$1<a href="$2">$2</a>');
  const lines = src.split("\n"); let out = "", i = 0;
  while (i < lines.length) {
    const line = lines[i], block = line.match(/^\u0000(\d+)\u0000$/);
    if (block) { const b = blocks[+block[1]]; out += codeBlock(b.code, b.lang); i++; continue; }
    if (/^#{1,3} /.test(line)) { const n = line.match(/^#+/)[0].length; out += `<h${n}>${inline(line.slice(n + 1))}</h${n}>`; i++; continue; }
    if (/^\s*[-*] /.test(line)) { out += "<ul>"; while (i < lines.length && /^\s*[-*] /.test(lines[i])) out += `<li>${inline(lines[i++].replace(/^\s*[-*] /, ""))}</li>`; out += "</ul>"; continue; }
    if (/^\s*\d+[.)] /.test(line)) { out += "<ol>"; while (i < lines.length && /^\s*\d+[.)] /.test(lines[i])) out += `<li>${inline(lines[i++].replace(/^\s*\d+[.)] /, ""))}</li>`; out += "</ol>"; continue; }
    if (/^> ?/.test(line)) { const q = []; while (i < lines.length && /^> ?/.test(lines[i])) q.push(lines[i++].replace(/^> ?/, "")); out += `<blockquote>${inline(q.join(" "))}</blockquote>`; continue; }
    if (/^\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
      const cells = l => l.trim().slice(1, -1).split("|").map(x => inline(x.trim()));
      out += "<table><tr>" + cells(line).map(x => `<th>${x}</th>`).join("") + "</tr>"; i += 2;
      while (i < lines.length && /^\|.*\|\s*$/.test(lines[i])) out += "<tr>" + cells(lines[i++]).map(x => `<td>${x}</td>`).join("") + "</tr>";
      out += "</table>"; continue;
    }
    if (!line.trim()) { i++; continue; }
    const para = [];
    while (i < lines.length && lines[i].trim() && !/^(#{1,3} |\s*[-*] |\s*\d+[.)] |> ?|\u0000|\|)/.test(lines[i])) para.push(lines[i++]);
    if (!para.length) para.push(lines[i++]);
    out += `<p>${inline(para.join("\n")).replace(/\n/g, "<br>")}</p>`;
  }
  return out;
}
const snippets = {};
function codeBlock(code, lang) {
  const id = "c" + uid(); snippets[id] = code;
  const preview = /^(html|svg)$/i.test(lang) ? `<button onclick="openArt({title: 'Preview', kind: '${lang.toLowerCase()}', content: snippets['${id}']})">Preview</button>` : "";
  return `<div class="codeblock"><div class="bar"><span>${esc(lang || "code")}</span><span>${preview}<button onclick="copyText(snippets['${id}'], this)">Copy</button></span></div><pre><code>${esc(code)}</code></pre></div>`;
}
function copyText(text, btn) {
  const done = () => { if (btn && btn.textContent.trim()) { const t = btn.textContent; btn.textContent = "Copied"; setTimeout(() => btn.textContent = t, 1200); } else toast("Copied"); };
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done)); else fallbackCopy(text, done);
}
function fallbackCopy(text, done) { const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); done(); }

function pickProject(id) { project = id; renderSide(); if (!id) return; const c = Store.listChats().find(x => x.project === id); c ? openChat(c.id) : newChat(); }

// The small line above the message bar only appears when something isn't the default.

  const parts = [], agents = allAgents(), agent = currentAgent();
  if (agent !== "assistant") parts.push(agents[agent]?.name || agent);
  if (settings.model !== "auto" && installed().includes(settings.model)) parts.push(CATALOG[settings.model].label);
  if (settings.style !== "normal") parts.push(settings.style[0].toUpperCase() + settings.style.slice(1));

function currentAgent() { return chat?.agent || window.nextAgent || "assistant"; }

function openChat(id) { chat = Store.getChat(id); if (!chat) return; if (chat.project) project = chat.project; closeDrawer(); closePanel(); renderSide(); renderOpts(); renderChat(); }

function renderChat() {
  const box = $("chat");
  if (!chat || !chat.messages.length) {
    const ready = installed().length;
    box.innerHTML = `<div id="empty"><span class="mark">${icon("spark")}</span>
      <h1>${ready ? greeting() : "Welcome"}</h1>
      <p>${ready ? "Runs on this phone. Works without the internet." : "Download a model to get started. It's a one off, and then it works offline."}</p>
      ${ready ? "" : `<button class="filled" onclick="showModels()">Choose a model</button>`}</div>`;
    return;
  }
  const results = {}; chat.messages.filter(m => m.role === "tool").forEach(m => results[m.tool_call_id] = m);
  const lastAnswer = chat.messages.reduce((last, m, i) => m.role === "assistant" && m.content ? i : last, -1);
  let out = "";
  chat.messages.forEach((m, i) => {
    if (m.role === "user") {
      out += `<div class="msg user" onclick="this.classList.toggle('show')"><div class="bubble">${esc(m.content)}</div>
        ${(m.attachments || []).map(a => `<div class="attached">${icon("doc")}${esc(a.name)}</div>`).join("")}
        <div class="tools-row"><button class="icon-btn" onclick="event.stopPropagation(); editMessage(${i})" aria-label="Edit">${icon("edit")}</button>
        <button class="icon-btn" onclick="event.stopPropagation(); copyText(chat.messages[${i}].content)" aria-label="Copy">${icon("copy")}</button></div></div>`;
    } else if (m.role === "assistant") {
      const steps = (m.tool_calls || []).map(c => toolHtml(c, results[c.id])).join("");
      if (!steps && !m.content && !m.thinking) return;
      out += `<div class="msg ai">`;
      if (m.thinking) out += step("bulb", "Reasoning", esc(m.thinking), "thinking");
      if (m.content) out += `<div class="md">${md(m.content)}</div>`;
      out += steps;
      if (i === lastAnswer) out += `<div class="tools-row"><button class="icon-btn" onclick="copyText(chat.messages[${i}].content)" aria-label="Copy">${icon("copy")}</button>
        <button class="icon-btn" onclick="regenerate()" aria-label="Try again">${icon("redo")}</button></div>`;
      out += `</div>`;
    }
  });
  box.innerHTML = out;
  box.scrollTop = box.scrollHeight;
}
function greeting() { const h = new Date().getHours(); return h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening"; }
function step(iconName, label, detail, cls = "", isMd = false) {
  return `<details class="step ${cls}"><summary>${icon(iconName)}<span class="txt">${esc(label)}</span>${icon("chev", "width:16px;height:16px").replace('class="i"', 'class="i chev"')}</summary>
    <div class="detail${isMd ? " md" : ""}">${detail}</div></details>`;
}
function toolHtml(call, result) {
  let a = {}; try { a = JSON.parse(call.function.arguments || "{}"); } catch (e) {}
  const name = call.function.name;
  if (name === "create_artifact") {
    const art = (chat.artifacts || []).find(x => result && x.id === result.artifact) || (chat.artifacts || []).find(x => x.title === a.title);
    return art ? artifactCard(art) : "";
  }
  if (name === "ask_agent") {
    const log = (result?.agent_log || []).map(e => e.content ? md(e.content) : "").join("") || esc(result?.content || "Working...");
    return `<div class="agentbox">${step("person", `Asked ${result?.agent || a.agent}: ${a.task || ""}`, log, "", true)}</div>`;
  }
  return step(toolIcon(name), toolLabel(name, a), esc(result ? result.content : "Working..."));
}
function toolIcon(name) { return name === "web_search" ? "search" : PHONE_TOOLS[name] ? "phone" : "globe"; }
function toolLabel(name, a) {
  if (PHONE_TOOLS[name]) return PHONE_TOOLS[name](a);
  if (name === "web_search") return `Searched for “${a.query}”`;
  if (name === "read_webpage") { try { return `Read ${new URL(a.url).hostname.replace(/^www\./, "")}`; } catch (e) { return "Read a web page"; } }
  return name.replace(/_/g, " ");
}
const arts = {};
function artifactCard(a) {
  arts[a.id] = a;
  const kind = {html: ["globe", "Web page"], svg: ["image", "Drawing"], markdown: ["doc", "Document"], code: ["code", "Code"]}[a.kind] || ["doc", "File"];
  return `<button class="artifact" onclick="openArt(arts['${a.id}'])"><span class="badge">${icon(kind[0])}</span>
    <span><b>${esc(a.title)}</b><small>${kind[1]}${a.version > 1 ? ` · version ${a.version}` : ""}</small></span>${icon("chev").replace('class="i"', 'class="i chev"')}</button>`;
}

  const m = chat.messages[i]; $("input").value = m.content; attachments = m.attachments || []; renderAttachments();
  $("input").dataset.edit = i; autosize(); $("input").focus(); toast("Editing. Sending replaces this message and the replies after it.");

// ------------------------------------------------ sending

function keydown(e) { if (e.key === "Enter" && !e.shiftKey && window.matchMedia("(min-width: 900px)").matches) { e.preventDefault(); send(); } }
function autosize() { const t = $("input"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 180) + "px"; }
async function attach(files) {
  for (const f of files) {
    if (/\.(png|jpe?g|gif|webp|heic|pdf|docx?)$/i.test(f.name)) { toast(`${f.name}: only text and code files can be read on the phone.`); continue; }
    if (f.size > 2e6) { toast(`${f.name} is too big (over 2 MB).`); continue; }
    const text = await f.text();
    if (text.slice(0, 2000).includes("\u0000")) { toast(`${f.name} doesn't look like a text file.`); continue; }
    attachments.push({name: f.name, text: text.slice(0, 200000)});
  }
  $("file").value = ""; renderAttachments();
}
function renderAttachments() {
  $("attachments").innerHTML = attachments.map((a, i) => `<span class="file">${esc(a.name)}<button onclick="attachments.splice(${i}, 1); renderAttachments()" aria-label="Remove">${icon("close", "width:16px;height:16px")}</button></span>`).join("");
}
async function send(extra = {}) {
  const text = $("input").value.trim();
  if (!extra.regenerate && !text && !attachments.length) return;
  if (!chat) { chat = Store.newChat(project, currentAgent()); window.nextAgent = null; }
  const body = {text, attachments, style: settings.style, think: settings.think, ...extra};
  if ($("input").dataset.edit !== undefined && !extra.regenerate) { body.edit_index = +$("input").dataset.edit; delete $("input").dataset.edit; }
  try { await startJob(chat, body); } catch (e) { toast(e.message); return; }
  $("input").value = ""; attachments = []; renderAttachments(); autosize(); $("input").blur();
  renderChat(); renderOpts(); startLive();
}
function regenerate() { send({regenerate: true}); }
function stopJob() { if (job) job.controller.abort(); }

function emit(ev) { onEvent(ev); }
function startLive() { live = {el: document.createElement("div"), subs: {}, current: null, raw: ""}; live.el.className = "msg ai"; $("chat").appendChild(live.el); }

}

  const el = d.firstElementChild; liveTarget(sub).appendChild(el);

function onEvent(ev) {
  if (!chat || ev.chat !== chat.id) return;
  if (ev.type === "status") { setStatus(ev.text); return; }
  if (!live && ["assistant_start", "token", "tool_call", "agent_start", "artifact"].includes(ev.type)) startLive();
  const box = $("chat");
  if (ev.type === "assistant_start") {
    live.current = document.createElement("div"); live.current.className = "md cursor"; live.raw = ""; liveTarget(ev.sub).appendChild(live.current); setStatus("");
  } else if (ev.type === "token" && live.current) {
    live.raw += ev.text;
    live.current.innerHTML = md(live.raw.replace(/<think>[\s\S]*?(<\/think>|$)/g, m => m.includes("</think>") ? "" : "_Thinking it through..._"));
  } else if (ev.type === "assistant_end" && live.current) {
    live.current.classList.remove("cursor"); if (!ev.message.content) live.current.remove();
  } else if (ev.type === "tool_call") {
    if (ev.name !== "create_artifact" && ev.name !== "ask_agent") liveStep(ev.sub, ev.id, toolLabel(ev.name, ev.args), toolIcon(ev.name));
  } else if (ev.type === "tool_result") {
    const d = $("t_" + ev.id); if (d) { d.querySelector(".detail").textContent = ev.result; d.querySelector(".live-dot")?.remove(); }
  } else if (ev.type === "agent_start") {
    liveTarget(ev.id).label.textContent = `Asked ${ev.agent}`;
  } else if (ev.type === "agent_end") {
    const t = live.subs[ev.id]; if (t) t.closest("details").open = false;
  } else if (ev.type === "artifact") {
    const d = document.createElement("div"); d.innerHTML = artifactCard(ev.artifact); live.el.appendChild(d.firstElementChild); openArt(ev.artifact);
  } else if (ev.type === "error") {
    lastError = ev.text;
    const d = document.createElement("div"); d.className = "msg note"; d.textContent = ev.text; box.appendChild(d);
  } else if (ev.type === "done") {
    live = null; setStatus(""); const notes = [...box.querySelectorAll(".msg.note")].map(e => e.textContent);
    chat = Store.getChat(chat.id); renderChat(); renderOpts();
    notes.forEach(t => { const d = document.createElement("div"); d.className = "msg note"; d.textContent = t; box.appendChild(d); });
  }
  box.scrollTop = box.scrollHeight;
}

// ------------------------------------------------ scheduled chats

const REPEATS = {daily: "Every day", weekdays: "Weekdays", weekly: "Every week", once: "Once"};
const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
function schedules() { return readJSON("schedules.json", []); }
function saveSchedules(list) { writeJSON("schedules.json", list); B.schedulesChanged(); }
// When a schedule should next run, in milliseconds, or 0 for never.
function nextRun(s, from = Date.now()) {
  if (!s.enabled) return 0;
  if (s.repeat === "once") { const t = new Date(`${s.date}T${s.time}`).getTime(); return t > from ? t : 0; }
  const [h, m] = (s.time || "07:00").split(":").map(Number);
  for (let i = 0; i < 9; i++) {
    const t = new Date(from); t.setDate(t.getDate() + i); t.setHours(h, m, 0, 0);
    const wd = t.getDay();
    if (t.getTime() <= from || (s.repeat === "weekdays" && (wd === 0 || wd === 6)) || (s.repeat === "weekly" && wd !== +s.day)) continue;
    return t.getTime();
  }
  return 0;
}
function describeSchedule(s) {
  if (s.repeat === "once") return `${new Date(`${s.date}T${s.time}`).toLocaleDateString("en-GB", {weekday: "short", day: "numeric", month: "short"})} at ${s.time}`;
  if (s.repeat === "weekly") return `${DAYS[+s.day]}s at ${s.time}`;
  return `${REPEATS[s.repeat]} at ${s.time}`;
}
function nextText(s) {
  const t = s.enabled ? s.next_run : 0;
  return t ? "Next " + new Date(t).toLocaleString("en-GB", {weekday: "short", hour: "2-digit", minute: "2-digit"}) : s.enabled ? "Finished" : "Paused";
}
function scheduleChat(s, list) {
  let c = s.chat_id && Store.getChat(s.chat_id);
  if (!c) {
    c = Store.newChat(null, s.agent || "assistant"); c.title = s.title; c.scheduled = s.id; Store.saveChat(c);
    s.chat_id = c.id; saveSchedules(list);
  }
  return c;
}
function showSchedules() {
  const draw = () => {
    const list = schedules();
    const warn = [];
    if (!B.exactAlarmsAllowed()) warn.push(`<div class="item"><span class="grow">Allow on time alarms<small>Without this, scheduled chats can run late.</small></span><button class="tonal" onclick="B.openAlarmSettings()">Allow</button></div>`);
    if (!B.notificationsAllowed()) warn.push(`<div class="item"><span class="grow">Allow notifications<small>So you hear when a scheduled chat has an answer.</small></span><button class="tonal" onclick="B.askForNotifications()">Allow</button></div>`);
    sheet(`<h2>Scheduled</h2><p class="sub">Chats that run on their own, like a morning briefing. Each one keeps its answers in its own chat, and you get a notification.</p>
      ${warn.length ? `<div class="list" style="margin-bottom:12px">${warn.join("")}</div>` : ""}
      <div class="list">${list.map(x => `<div class="item"><span class="grow" onclick="editSchedule('${x.id}')" style="cursor:pointer">${esc(x.title)}<small>${describeSchedule(x)} · ${nextText(x)}</small></span>
        ${toggle("sch-" + x.id, x.enabled).replace("<input", `<input onchange="toggleSchedule('${x.id}', this.checked)"`)}</div>`).join("")
        || `<div class="item"><span class="grow">Nothing scheduled yet<small>For example: every morning at 7, summarise today's news.</small></span></div>`}</div>
      <div class="buttons"><button class="tonal left" onclick="editSchedule()">New</button><button class="text" onclick="closeSheet()">Done</button></div>`);
  };
  window.__sheetRedraw = () => { if (document.querySelector(".sheet-bg")) draw(); };
  draw();
}
function toggleSchedule(id, on) {
  const list = schedules(), s = list.find(x => x.id === id);
  s.enabled = on; s.next_run = nextRun(s); saveSchedules(list); showSchedules();
}

  const s = id ? schedules().find(x => x.id === id) : {title: "", prompt: "", repeat: "daily", time: "07:00", day: 1, date: tomorrow, agent: "assistant", enabled: true};
  const agents = Object.entries(allAgents()).filter(([k]) => k !== "phone");

  sheet(`<h2>${id ? "Edit scheduled chat" : "New scheduled chat"}</h2>
    <div class="field"><label>Name</label><input type="text" id="scTitle" value="${esc(s.title)}" placeholder="For example: Morning briefing"></div>
    <div class="field"><label>What to ask</label><textarea id="scPrompt" rows="4" placeholder="For example: Search for today's weather in Enfield and the top UK news, and give me a short summary.">${esc(s.prompt)}</textarea></div>
    <div class="field"><label>When</label><select id="scRepeat">${Object.entries(REPEATS).map(([k, l]) => `<option value="${k}" ${s.repeat === k ? "selected" : ""}>${l}</option>`).join("")}</select></div>
    <div class="field" id="scDayField"><label>Day</label><select id="scDay">${DAYS.map((d, i) => `<option value="${i}" ${+s.day === i ? "selected" : ""}>${d}</option>`).join("")}</select></div>
    <div class="field" id="scDateField"><label>Date</label><input type="date" id="scDate" value="${esc(s.date || tomorrow)}"></div>
    <div class="field"><label>Time</label><input type="time" id="scTime" value="${esc(s.time)}"></div>
    <div class="field"><label>Agent</label><select id="scAgent">${agents.map(([k, a]) => `<option value="${k}" ${s.agent === k ? "selected" : ""}>${esc(a.name)}</option>`).join("")}</select></div>
    <div class="buttons">${id ? `<button class="danger left" onclick="deleteSchedule('${id}')">Delete</button><button class="text" onclick="runScheduleNow('${id}')">Run now</button>` : ""}
      <button class="text" onclick="showSchedules()">Cancel</button><button class="filled" id="scSave">Save</button></div>`, bg => {
    show(); bg.querySelector("#scRepeat").onchange = show;
    bg.querySelector("#scSave").onclick = () => {
      const prompt = $("scPrompt").value.trim();
      if (!prompt) { toast("Write what to ask first."); return; }
      const list = schedules();
      const item = id ? list.find(x => x.id === id) : {id: uid(), enabled: true, created: now()};
      Object.assign(item, {title: $("scTitle").value.trim() || prompt.split(/\s+/).slice(0, 5).join(" "), prompt, repeat: $("scRepeat").value,
        day: +$("scDay").value, date: $("scDate").value, time: $("scTime").value || "07:00", agent: $("scAgent").value});
      item.next_run = nextRun(item);
      if (!id) list.push(item);
      saveSchedules(list);
      if (!B.notificationsAllowed()) B.askForNotifications();
      toast(item.next_run ? nextText(item) : "That time has already passed");
      showSchedules();
    };
  });
}
function deleteSchedule(id) {
  if (!confirm("Delete this scheduled chat? Its past answers stay in your chats.")) return;
  saveSchedules(schedules().filter(x => x.id !== id)); showSchedules();
}
function runScheduleNow(id) {
  const list = schedules(), s = list.find(x => x.id === id);
  closeSheet(); openChat(scheduleChat(s, list).id);
  $("input").value = s.prompt; send();
}

// Runs one scheduled chat in the hidden copy of this page that Android starts on time.
async function runScheduled(id) {
  const list = schedules(), s = list.find(x => x.id === id);
  if (!s) { B.scheduledDone("", "Scheduled chat", "That scheduled chat no longer exists."); return; }
  // Work out the next run first, so a crash part way through can't make it repeat.
  s.last_run = now();
  if (s.repeat === "once") s.enabled = false;
  s.next_run = nextRun(s, Date.now() + 60000);
  saveSchedules(list);
  chat = scheduleChat(s, list);
  window.__scheduledRun = s;
  try { await startJob(chat, {text: s.prompt, style: settings.style}); }
  catch (e) { B.scheduledDone(chat.id, s.title, e.message); }
}
let lastError = "";
function onJobDone(c, stopped) {
  if (phoneSession) { phoneSession = false; B.keepAlive(false); B.bringToFront(); }
  const s = window.__scheduledRun;
  if (!s) return;
  window.__scheduledRun = null;
  const last = [...c.messages].reverse().find(m => m.role === "assistant" && m.content);
  const plain = (last ? last.content : lastError || "Finished, with no answer.").replace(/[#*_`>|]/g, "").replace(/\n{2,}/g, "\n").trim();
  B.scheduledDone(c.id, s.title, plain.slice(0, 700));
}
window.onResumeApp = () => { if (window.__sheetRedraw) window.__sheetRedraw(); renderSide(); };

// ------------------------------------------------ start

(function start() {
  const runId = new URLSearchParams(location.search).get("run");
  if (runId) { runScheduled(runId); return; }
  renderOpts(); renderSide();
  const chats = Store.listChats();
  if (chats.length) openChat(chats[0].id); else renderChat();
  if (!installed().length) showModels();
  else {
    // Start loading the likely model now, so the first reply is quicker.
    const ready = installed(), key = ready.includes(settings.model) ? settings.model : ready.includes("general") ? "general" : ready[0];
    loadModel(key).then(() => setStatus(""), () => setStatus(""));
  }
})();
</script>

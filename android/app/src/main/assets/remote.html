<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Desk Agent Remote</title>
<!--
  Desk Agent Remote: uses Desk Agent on another device (a phone with remote control
  switched on) over the same Wi-Fi. Pair once with the address and 6-digit code the
  phone shows; after that this keeps the device's key and talks to its /api.
  Opened over the Android app (remote.html in its assets) and by the Windows app (/remote).
-->
<style>
:root {
  --bg: #f7f6fb; --surface: #ffffff; --raised: #efedf5; --text: #1d1b24; --dim: #625e70; --faint: #9a96a8;
  --line: #e4e1ec; --accent: #5b2a9e; --accent-text: #ffffff; --accent-soft: #ece4f8; --good: #2e9d62; --bad: #c2382d;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #131217; --surface: #1c1b22; --raised: #26242e; --text: #ecebf0; --dim: #a29fae; --faint: #6f6c7a;
          --line: #2e2c37; --accent: #c4a6f0; --accent-text: #24113f; --accent-soft: #2b2338; --good: #6fd19b; --bad: #f19a92; color-scheme: dark; }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; font: 16px/1.55 Roboto, system-ui, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column;
       padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; border-radius: 999px; padding: 8px 16px; min-height: 40px; }
button.filled { background: var(--accent); color: var(--accent-text); font-weight: 500; }
button.tonal { background: var(--raised); }
button.text { color: var(--accent); font-weight: 500; }
button:disabled { opacity: .5; cursor: default; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input, textarea, select { font: inherit; color: var(--text); background: var(--raised); border: 1px solid transparent; border-radius: 12px; padding: 11px 13px; width: 100%; }
input:focus, textarea:focus, select:focus { border-color: var(--accent); outline: none; }
.icon { width: 40px; height: 40px; min-height: 40px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

header { display: flex; align-items: center; gap: 6px; padding: 6px 8px; min-height: 56px; border-bottom: 1px solid var(--line); background: var(--surface); }
header .who { flex: 1; min-width: 0; display: grid; }
header .who b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
header .who small { color: var(--dim); font-size: 12px; display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex-shrink: 0; }
.dot.good { background: var(--good); } .dot.bad { background: var(--bad); }
.dot.busy { background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .dot.busy { animation: none; } }
nav.tabs { display: flex; gap: 4px; padding: 8px 12px; background: var(--surface); border-bottom: 1px solid var(--line); overflow-x: auto; }
nav.tabs button { padding: 6px 14px; min-height: 36px; color: var(--dim); }
nav.tabs button.on { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
main { flex: 1; overflow: auto; }
.page { max-width: 760px; margin: 0 auto; padding: 16px max(16px, env(safe-area-inset-right)) 32px max(16px, env(safe-area-inset-left)); display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
h1 { font-size: 22px; font-weight: 500; margin: 8px 0 0; letter-spacing: -.01em; }
h2 { font-size: 13px; font-weight: 500; color: var(--dim); margin: 6px 0 -6px; letter-spacing: .04em; text-transform: uppercase; }
.sub { color: var(--dim); font-size: 14px; margin: 0; }
.field { display: grid; gap: 6px; } .field label { font-size: 13px; color: var(--dim); }
.row-buttons { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; width: 100%; text-align: left; border-radius: 0; min-height: 56px; }
.item + .item { border-top: 1px solid var(--line); }
.item .grow { flex: 1; min-width: 0; }
.item .grow b { font-weight: 500; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .grow small { color: var(--dim); font-size: 13px; display: block; }
.item .meta { color: var(--faint); font-size: 12px; white-space: nowrap; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: grid; gap: 4px; min-width: 0; }
.tile small { color: var(--dim); font-size: 12px; }
.tile b { font-weight: 500; display: flex; align-items: center; gap: 8px; min-width: 0; }
.tile b span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile .num { font-size: 22px; font-variant-numeric: tabular-nums; }
.switch { position: relative; width: 46px; height: 28px; flex-shrink: 0; }
.switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; background: var(--raised); border: 1px solid var(--line); border-radius: 999px; transition: background .15s; pointer-events: none; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--faint); transition: transform .15s, background .15s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(18px); background: var(--accent-text); }
.error { color: var(--bad); font-size: 14px; margin: 0; }

/* chat */
.chatview { display: flex; flex-direction: column; height: 100%; }
.chathead { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-bottom: 1px solid var(--line); background: var(--surface); }
.chathead b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.msgs { flex: 1; overflow: auto; padding: 16px max(16px, env(safe-area-inset-right)) 16px max(16px, env(safe-area-inset-left)); display: flex; flex-direction: column; gap: 14px; }
.msgs > * { max-width: 760px; width: 100%; margin: 0 auto; }
.u { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.u .bubble { background: var(--accent-soft); border-radius: 18px 18px 6px 18px; padding: 9px 14px; max-width: 85%; white-space: pre-wrap; word-wrap: break-word; }
.u small { color: var(--faint); font-size: 12px; }
.a { white-space: pre-wrap; word-wrap: break-word; min-width: 0; }
.a .steps { color: var(--dim); font-size: 13px; display: grid; gap: 2px; margin-bottom: 4px; }
.a code { font-family: "Roboto Mono", ui-monospace, monospace; font-size: .9em; background: var(--raised); padding: 1px 5px; border-radius: 6px; }
.a pre { background: var(--raised); padding: 10px 12px; border-radius: 12px; overflow-x: auto; white-space: pre; font: 13px/1.5 "Roboto Mono", ui-monospace, monospace; }
.waiting { color: var(--dim); font-size: 13px; text-align: right; }
.composer { padding: 8px max(12px, env(safe-area-inset-right)) 12px max(12px, env(safe-area-inset-left)); border-top: 1px solid var(--line); background: var(--surface); }
.composer .box { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
.composer textarea { resize: none; min-height: 44px; max-height: 160px; border-radius: 22px; padding: 11px 16px; }
.composer button { flex-shrink: 0; }
</style>
</head>
<body>
<header id="head" hidden>
  <button class="icon" id="closeBtn" onclick="leave()" aria-label="Close" hidden><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <span class="who"><b id="devName"></b><small><i class="dot" id="devDot"></i><span id="devState">Connecting...</span></small></span>
  <button class="tonal" onclick="showDevices()">Devices</button>
</header>
<nav class="tabs" id="tabs" hidden>
  <button data-tab="chats" onclick="go('chats')">Chats</button>
  <button data-tab="dash" onclick="go('dash')">Dashboard</button>
  <button data-tab="sched" onclick="go('sched')">Scheduled</button>
</nav>
<main id="main"></main>

<script>
"use strict";
// ------------------------------------------------ saved devices (this device only)
const store = {
  load() { try { return JSON.parse(localStorage.getItem("desk-remote") || "{}"); } catch (e) { return {}; } },
  save(s) { try { localStorage.setItem("desk-remote", JSON.stringify(s)); } catch (e) {} },
};
let saved = store.load();
saved.devices ||= [];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const current = () => saved.devices.find(d => d.address === saved.current) || null;
const inApp = window.parent !== window;
$("closeBtn").hidden = !inApp;
function leave() { if (inApp) parent.postMessage("remote:close", "*"); }

const ago = iso => {
  if (!iso) return "";
  const m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  return m < 1 ? "just now" : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : new Date(iso).toLocaleDateString("en-GB", {day: "numeric", month: "short"});
};

// ------------------------------------------------ talking to the device
async function api(method, path, body, device = current()) {
  let res;
  try {
    res = await fetch(`http://${device.address}${path}`, {method, headers: {"Content-Type": "application/json", Authorization: "Bearer " + (device.key || "")},
      body: body ? JSON.stringify(body) : undefined, signal: AbortSignal.timeout(35000)});
  } catch (e) {
    throw new Error("Can't reach the phone. Check it's on the same Wi-Fi, Desk Agent is open there, and remote control is switched on.");
  }
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) { forget(device.address); throw new Error("The phone no longer knows this device. Pair again with a new code."); }
  if (!res.ok) throw new Error(data.error || `The phone said ${res.status}.`);
  return data;
}
function forget(address) {
  saved.devices = saved.devices.filter(d => d.address !== address);
  if (saved.current === address) saved.current = saved.devices[0]?.address || null;
  store.save(saved);
}

// ------------------------------------------------ pairing
function showPair(message) {
  stopPolling();
  $("head").hidden = !saved.devices.length; $("tabs").hidden = true;
  $("main").innerHTML = `<div class="page">
    <h1>Control another device</h1>
    <p class="sub">On the phone, open Desk Agent, then Remote control, and switch on "Let other devices control this phone". Enter the address and code it shows. Both devices need to be on the same Wi-Fi.</p>
    <div class="field"><label for="pAddr">Address</label><input id="pAddr" inputmode="url" autocomplete="off" autocapitalize="off" placeholder="for example 192.168.1.23:8765"></div>
    <div class="field"><label for="pCode">Code</label><input id="pCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6 digits"></div>
    ${message ? `<p class="error">${esc(message)}</p>` : ""}
    <div class="row-buttons">${saved.devices.length ? `<button class="text" onclick="go('chats')">Cancel</button>` : inApp ? `<button class="text" onclick="leave()">Cancel</button>` : ""}<button class="filled" id="pGo">Pair</button></div>
  </div>`;
  $("pGo").onclick = async () => {
    let address = $("pAddr").value.trim().replace(/^https?:\/\//, "").replace(/\/.*$/, "");
    if (address && !/:\d+$/.test(address)) address += ":8765";
    const code = $("pCode").value.replace(/\D/g, "");
    if (!address || code.length !== 6) return showPair("Enter the address and the 6 digit code.");
    $("pGo").disabled = true; $("pGo").textContent = "Pairing...";
    try {
      const r = await api("POST", "/api/pair", {code}, {address, key: ""});
      saved.devices = saved.devices.filter(d => d.address !== address);
      saved.devices.push({address, key: r.key, name: r.name || address});
      saved.current = address; store.save(saved);
      go("chats");
    } catch (e) { showPair(e.message); $("pAddr").value = address; }
  };
}
function showDevices() {
  stopPolling();
  $("tabs").hidden = true;
  $("main").innerHTML = `<div class="page"><h1>Devices</h1>
    <div class="list">${saved.devices.map(d => `<div class="item"><span class="grow"><b>${esc(d.name)}</b><small>${esc(d.address)}</small></span>
      ${d.address === saved.current ? `<span class="meta">Using</span>` : `<button class="tonal" onclick="saved.current='${esc(d.address)}'; store.save(saved); go('chats')">Use</button>`}
      <button class="text" onclick="forget('${esc(d.address)}'); saved.devices.length ? showDevices() : showPair()">Remove</button></div>`).join("")}</div>
    <div class="row-buttons"><button class="tonal" onclick="showPair()">Pair another</button><button class="filled" onclick="go('chats')">Done</button></div></div>`;
}

// ------------------------------------------------ the device's state in the header
let state = null;
async function refreshState() {
  try {
    state = await api("GET", "/api/state");
    $("devState").textContent = state.working ? `Answering in "${state.working.title}"` : `Ready${state.model ? ", " + (state.models.find(m => m.key === state.model)?.label || state.model) : ""}`;
    $("devDot").className = "dot " + (state.working ? "busy" : "good");
  } catch (e) { $("devState").textContent = e.message.split(".")[0]; $("devDot").className = "dot bad"; throw e; }
  return state;
}

// ------------------------------------------------ pages
let tab = "chats", openChatId = null, poll = null;
function stopPolling() { clearInterval(poll); poll = null; }
function go(t) {
  stopPolling();
  const d = current();
  if (!d) return showPair();
  tab = t; openChatId = null;
  $("head").hidden = false; $("tabs").hidden = false; $("devName").textContent = d.name;
  document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  ({chats: showChats, dash: showDash, sched: showSched})[t]();
}
function loading() { $("main").innerHTML = `<div class="page"><p class="sub">Loading...</p></div>`; }
function failed(e) { $("main").innerHTML = `<div class="page"><p class="error">${esc(e.message)}</p><div class="row-buttons"><button class="tonal" onclick="go(tab)">Try again</button></div></div>`; }

async function showChats() {
  loading();
  try {
    const [, chats] = await Promise.all([refreshState(), api("GET", "/api/chats")]);
    $("main").innerHTML = `<div class="page">
      <div class="row-buttons" style="justify-content:space-between"><input type="search" id="q" placeholder="Search chats" style="flex:1" oninput="filterChats()"><button class="filled" onclick="newChat()">New chat</button></div>
      <div class="list" id="chatList"></div></div>`;
    window._chats = chats; filterChats();
  } catch (e) { failed(e); }
}
function filterChats() {
  const q = ($("q")?.value || "").toLowerCase(), list = (window._chats || []).filter(c => !q || c.title.toLowerCase().includes(q));
  $("chatList").innerHTML = list.map(c => `<button class="item" onclick="openChat('${esc(c.id)}')"><span class="grow"><b>${esc(c.title)}</b><small>${esc(c.agent)} · ${c.messages} message${c.messages === 1 ? "" : "s"}${c.busy ? " · answering now" : ""}</small></span><span class="meta">${ago(c.updated)}</span></button>`).join("")
    || `<div class="item"><span class="grow"><small>${q ? "No chats match." : "No chats yet. Start one with New chat."}</small></span></div>`;
}
async function newChat() {
  try { const c = await api("POST", "/api/chats", {}); openChat(c.id); } catch (e) { failed(e); }
}

function inline(t) {
  const blocks = [];
  t = esc(t).replace(/```[\w-]*\n?([\s\S]*?)```/g, (m, code) => { blocks.push(`<pre>${code}</pre>`); return `\u0000${blocks.length - 1}\u0000`; });
  t = t.replace(/`([^`\n]+)`/g, "<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>").replace(/^#{1,4} (.*)$/gm, "<b>$1</b>");
  return t.replace(/\u0000(\d+)\u0000/g, (m, i) => blocks[+i]);
}
function renderMsgs(c) {
  const html = c.items.map(m => m.role === "user"
    ? `<div class="u"><div class="bubble">${esc(m.text)}</div>${m.files?.length ? `<small>${m.files.map(esc).join(", ")}</small>` : ""}</div>`
    : `<div class="a">${m.steps?.length ? `<div class="steps">${m.steps.map(s => `<span>${esc(s)}</span>`).join("")}</div>` : ""}${inline(m.text)}</div>`).join("")
    + (c.busy ? `<div class="a">${c.live ? inline(c.live) : `<span class="sub">Thinking...</span>`}</div>` : "")
    + (c.waiting?.length ? `<div class="waiting">Waiting to send: ${c.waiting.map(esc).join(" · ")}</div>` : "");
  const box = $("msgs"), atEnd = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  box.innerHTML = html || `<p class="sub" style="text-align:center;margin-top:20vh">Send a message to the phone's Desk Agent.</p>`;
  if (atEnd) box.scrollTop = box.scrollHeight;
  $("stopBtn").hidden = !c.busy;
}
async function openChat(id) {
  stopPolling();
  openChatId = id; $("tabs").hidden = true;
  $("main").innerHTML = `<div class="chatview">
    <div class="chathead"><button class="icon" onclick="go('chats')" aria-label="Back to chats"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button><b id="chatTitle">Chat</b>
      <button class="tonal" id="stopBtn" onclick="stopReply()" hidden>Stop</button></div>
    <div class="msgs" id="msgs"></div>
    <div class="composer"><div class="box"><textarea id="msgIn" rows="1" placeholder="Message the phone's Desk Agent" oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,160)+'px'"></textarea>
      <button class="filled" id="sendBtn" onclick="sendMsg()">Send</button></div></div></div>`;
  $("msgIn").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && matchMedia("(min-width: 700px)").matches) { e.preventDefault(); sendMsg(); } });
  let quiet = 0;
  const tick = async () => {
    if (openChatId !== id) return;
    try {
      const c = await api("GET", `/api/chats/${id}`);
      $("chatTitle").textContent = c.title; renderMsgs(c);
      quiet = c.busy || c.waiting?.length ? 0 : quiet + 1;
    } catch (e) { $("msgs").innerHTML = `<p class="error">${esc(e.message)}</p>`; }
    if (quiet > 2) stopPolling();  // nothing happening: stop asking until something is sent
  };
  await tick();
  poll = setInterval(tick, 1200);
  window._tick = () => { quiet = 0; if (!poll) poll = setInterval(tick, 1200); tick(); };
}
async function sendMsg() {
  const text = $("msgIn").value.trim();
  if (!text) return;
  $("sendBtn").disabled = true;
  try { await api("POST", `/api/chats/${openChatId}/send`, {text}); $("msgIn").value = ""; $("msgIn").style.height = ""; window._tick(); }
  catch (e) { alert(e.message); }
  $("sendBtn").disabled = false;
}
async function stopReply() { try { await api("POST", "/api/stop"); window._tick(); } catch (e) {} }

async function showDash() {
  loading();
  try {
    const s = await refreshState(), gb = n => (n / 1e9).toFixed(1) + " GB";
    $("main").innerHTML = `<div class="page">
      <h2>Right now</h2><div class="tiles">
        <div class="tile"><small>AI</small><b><i class="dot ${s.model ? "good" : ""}"></i><span>${esc(s.model ? (s.models.find(m => m.key === s.model)?.label || s.model) + " loaded" : "Not loaded yet")}</span></b></div>
        <div class="tile"><small>Working on</small><b><i class="dot ${s.working ? "busy" : ""}"></i><span>${esc(s.working ? `"${s.working.title}"` + (s.waiting ? `, ${s.waiting} waiting` : "") : "Nothing")}</span></b></div>
        <div class="tile"><small>Downloads</small><b><i class="dot ${s.downloads.length ? "busy" : ""}"></i><span>${esc(s.downloads.map(d => `${d.model} ${d.percent}%`).join(", ") || "None")}</span></b></div>
        <div class="tile"><small>Free space</small><b><span>${gb(s.free_space)}</span></b></div>
      </div>
      <h2>Usage</h2><div class="tiles">
        <div class="tile"><b class="num">${s.stats.replies.toLocaleString()}</b><small>replies</small></div>
        <div class="tile"><b class="num">${s.stats.words.toLocaleString()}</b><small>words written</small></div>
        <div class="tile"><b class="num">${s.stats.chats.toLocaleString()}</b><small>chats</small></div>
        <div class="tile"><b class="num" style="font-size:18px">${esc(ago(s.stats.last_used) || "never")}</b><small>last reply</small></div>
      </div>
      <h2>Models on the phone</h2><div class="list">${s.models.map(m => `<div class="item"><span class="grow"><b>${esc(m.label)}</b><small>${esc(m.detail)}</small></span>${m.key === s.model ? `<span class="meta">In use</span>` : ""}</div>`).join("") || `<div class="item"><span class="grow"><small>None yet</small></span></div>`}</div>
      <h2>Recent problems</h2><div class="list">${s.problems.map(p => `<div class="item"><span class="grow"><small style="color:var(--text)">${esc(p.text)}</small><small>${ago(p.at)}</small></span></div>`).join("") || `<div class="item"><span class="grow"><small>None</small></span></div>`}</div>
    </div>`;
    poll = setInterval(() => tab === "dash" && !openChatId ? refreshState().catch(() => {}) : stopPolling(), 3000);
  } catch (e) { failed(e); }
}

async function showSched() {
  loading();
  try {
    const [, list] = await Promise.all([refreshState(), api("GET", "/api/schedules")]);
    $("main").innerHTML = `<div class="page">
      <div class="list">${list.map(x => `<div class="item"><span class="grow"><b>${esc(x.title)}</b><small>${esc(x.when)} · ${esc(x.next)}${x.last_run ? " · last ran " + ago(x.last_run) : ""}</small></span>
        <label class="switch"><input type="checkbox" ${x.enabled ? "checked" : ""} onchange="setSched('${esc(x.id)}', this.checked)" aria-label="On or off"><span></span></label>
        <button class="text" onclick="delSched('${esc(x.id)}')">Delete</button></div>`).join("") || `<div class="item"><span class="grow"><small>Nothing scheduled on the phone.</small></span></div>`}</div>
      <h2>New scheduled chat</h2>
      <div class="field"><label for="sTitle">Name</label><input id="sTitle" placeholder="For example: Morning briefing"></div>
      <div class="field"><label for="sPrompt">What to ask</label><textarea id="sPrompt" rows="3" placeholder="For example: the weather in Enfield and the top UK news, short."></textarea></div>
      <div class="tiles" style="gap:12px"><div class="field"><label for="sRepeat">When</label><select id="sRepeat"><option value="daily">Every day</option><option value="weekdays">Weekdays</option><option value="weekly">Every week</option></select></div>
        <div class="field"><label for="sTime">Time</label><input id="sTime" type="time" value="07:30"></div></div>
      <p class="error" id="sErr" hidden></p>
      <div class="row-buttons"><button class="filled" onclick="addSched()">Add</button></div>
    </div>`;
  } catch (e) { failed(e); }
}
async function setSched(id, on) { try { await api("POST", `/api/schedules/${id}`, {enabled: on}); showSched(); } catch (e) { alert(e.message); } }
async function delSched(id) { try { await api("DELETE", `/api/schedules/${id}`); showSched(); } catch (e) { alert(e.message); } }
async function addSched() {
  const prompt = $("sPrompt").value.trim();
  if (!prompt) { $("sErr").hidden = false; $("sErr").textContent = "Say what to ask."; return; }
  try { await api("POST", "/api/schedules", {title: $("sTitle").value, prompt, repeat: $("sRepeat").value, time: $("sTime").value}); showSched(); }
  catch (e) { $("sErr").hidden = false; $("sErr").textContent = e.message; }
}

current() ? go("chats") : showPair();
</script>
</body>
</html>

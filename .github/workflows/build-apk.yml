name: Build Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build the llama.cpp engine for Android (arm64)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo ggml-org/llama.cpp --json tagName -q .tagName)
          echo "Using llama.cpp $tag"
          git clone --depth 1 --branch "$tag" https://github.com/ggml-org/llama.cpp llama.cpp
          # Static build with no OpenMP, so the engine is one file that needs nothing else
          # on the phone. dotprod and fp16 suit the Pixel 9's Tensor G4 and every recent phone.
          cmake -S llama.cpp -B llama-build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DGGML_OPENMP=OFF -DGGML_NATIVE=OFF \
            -DGGML_CPU_ARM_ARCH=armv8.2-a+dotprod+fp16 -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF
          cmake --build llama-build --target llama-server -j 4
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp llama-build/bin/llama-server android/app/src/main/jniLibs/arm64-v8a/libllamaserver.so
          file android/app/src/main/jniLibs/arm64-v8a/libllamaserver.so
          echo "Libraries it needs on the phone:"
          "$ANDROID_NDK_LATEST_HOME"/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf -d android/app/src/main/jniLibs/arm64-v8a/libllamaserver.so | grep NEEDED
          if "$ANDROID_NDK_LATEST_HOME"/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf -d android/app/src/main/jniLibs/arm64-v8a/libllamaserver.so \
               | grep NEEDED | grep -vE 'lib(c|m|dl|log)\.so'; then
            echo "The engine needs a library that isn't on every phone"; exit 1
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # Every build must be signed with the same key, or Android won't install a new
      # version over the old one. The key lives in GitHub's build cache (never in the
      # code). Saving it as the repo secrets ANDROID_KEYSTORE_BASE64 and
      # ANDROID_KEY_PASSWORD instead makes it permanent; the cache is dropped if no
      # build runs for 7 days.
      - name: Restore the signing key
        uses: actions/cache@v4
        with:
          path: ~/.deskagent-signing
          key: deskagent-signing-key-v1

      - name: Set up the signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          dir="$HOME/.deskagent-signing"
          mkdir -p "$dir"
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$dir/secret.keystore"
            store="$dir/secret.keystore"; pass="$KEY_PASSWORD"
          else
            store="$dir/deskagent.keystore"
            if [ ! -s "$store" ] || [ ! -s "$dir/password" ]; then
              echo "::warning::Making a new signing key. Phones with an older build must uninstall it once."
              openssl rand -base64 24 > "$dir/password"
              keytool -genkeypair -storetype PKCS12 -keystore "$store" -alias deskagent -keyalg RSA -keysize 3072 \
                -validity 10950 -storepass "$(cat "$dir/password")" -keypass "$(cat "$dir/password")" -dname "CN=Desk Agent Mobile, C=GB"
            fi
            pass=$(cat "$dir/password")
          fi
          echo "::add-mask::$pass"
          echo "SIGNING_STORE_FILE=$store" >> "$GITHUB_ENV"
          echo "SIGNING_PASSWORD=$pass" >> "$GITHUB_ENV"
          keytool -list -keystore "$store" -storepass "$pass" | grep -i fingerprint

      - name: Build the APK
        run: gradle -p android assembleRelease --no-daemon

      - name: Check the signature
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          signer=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$signer" verify --print-certs "$apk"
          cp "$apk" DeskAgent.apk
          ls -la DeskAgent.apk

      - name: Build the complete APK, with a model inside
        # The Quick model (about 1 GB) goes in as a native library, which Android unpacks
        # on install, so the app works straight away with nothing else to download.
        run: |
          repo=bartowski/Qwen2.5-1.5B-Instruct-GGUF
          name=$(curl -sf "https://huggingface.co/api/models/$repo" | python3 -c "import json,sys; f=[s['rfilename'] for s in json.load(sys.stdin)['siblings'] if s['rfilename'].lower().endswith('.gguf') and 'q4_k_m' in s['rfilename'].lower() and '-of-' not in s['rfilename']]; print(sorted(f, key=len)[0])")
          echo "Packing in $repo/$name"
          curl -fL --retry 3 -o android/app/src/main/jniLibs/arm64-v8a/libmodel_quick.so "https://huggingface.co/$repo/resolve/main/$name"
          ls -la android/app/src/main/jniLibs/arm64-v8a/
          gradle -p android assembleRelease --no-daemon
          apk=android/app/build/outputs/apk/release/app-release.apk
          signer=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$signer" verify "$apk"
          unzip -l "$apk" | grep libmodel_quick
          cp "$apk" DeskAgent-Complete.apk
          ls -la DeskAgent-Complete.apk

      - name: Build the phone APK, with the Tiny model inside
        # Under 400 MB (Q4_0 instead of Q4_K_M), so it can be sent straight to a phone as one file.
        run: |
          rm android/app/src/main/jniLibs/arm64-v8a/libmodel_quick.so
          repo=bartowski/Qwen2.5-0.5B-Instruct-GGUF
          name=$(curl -sf "https://huggingface.co/api/models/$repo" | python3 -c "import json,sys; f=[s['rfilename'] for s in json.load(sys.stdin)['siblings'] if s['rfilename'].lower().endswith('.gguf') and 'q4_0' in s['rfilename'].lower() and '-of-' not in s['rfilename']]; print(sorted(f, key=len)[0])")
          echo "Packing in $repo/$name"
          curl -fL --retry 3 -o android/app/src/main/jniLibs/arm64-v8a/libmodel_tiny.so "https://huggingface.co/$repo/resolve/main/$name"
          gradle -p android assembleRelease --no-daemon
          apk=android/app/build/outputs/apk/release/app-release.apk
          signer=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$signer" verify "$apk"
          unzip -l "$apk" | grep libmodel_tiny
          cp "$apk" DeskAgent-Phone.apk
          ls -la DeskAgent-Phone.apk
          [ "$(stat -c%s DeskAgent-Phone.apk)" -lt 400000000 ] || echo "::warning::DeskAgent-Phone.apk is over 400 MB"

      - uses: actions/upload-artifact@v4
        with:
          name: DeskAgent-APK
          path: DeskAgent.apk

      - name: Put both APKs on the download page
        # A GitHub release, so the phone can download them in Chrome. Release files can be
        # up to 2 GB; files kept in git can't be over 100 MB.
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-latest
          name: Desk Agent for Android
          make_latest: true
          overwrite_files: true
          body: |
            **DeskAgent-Complete.apk** has everything, including the Quick AI model: install it and it works, no other downloads.
            **DeskAgent-Phone.apk** has the Tiny AI model inside (under 500 MB): install it and it works.
            **DeskAgent.apk** is the small version (about 40 MB); it downloads a model the first time you open it.
            Built from ${{ github.sha }}.
          files: |
            DeskAgent-Complete.apk
            DeskAgent-Phone.apk
            DeskAgent.apk

      - name: Publish the APK to the apk branch
        # Gives a permanent download link: github.com/<owner>/<repo>/raw/apk/DeskAgent.apk
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir publish && cp DeskAgent.apk publish/ && cd publish
          git init -b apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DeskAgent.apk
          git commit -m "APK built from ${{ github.sha }}"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk

      - name: Save the complete APK in pieces
        # Git can't hold files over 100 MB, so the complete APK is cut into 90 MB pieces
        # on the apk-complete branch. Join them back in order to get the APK.
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir pieces && cd pieces
          split -b 90m -d -a 2 ../DeskAgent-Complete.apk DeskAgent-Complete.apk.part
          sha256sum ../DeskAgent-Complete.apk | cut -d' ' -f1 > DeskAgent-Complete.apk.sha256
          split -b 90m -d -a 2 ../DeskAgent-Phone.apk DeskAgent-Phone.apk.part
          sha256sum ../DeskAgent-Phone.apk | cut -d' ' -f1 > DeskAgent-Phone.apk.sha256
          ls -la
          git init -b apk-complete
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Complete APK built from ${{ github.sha }}"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk-complete

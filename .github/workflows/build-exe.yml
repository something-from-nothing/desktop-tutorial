name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["android/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check it imports
        run: python -c "import deskagent"
      - name: Build app
        # A folder build starts faster than a single file EXE; the installer wraps it up.
        run: >
          pyinstaller --noconfirm --onedir --windowed --name DeskAgent
          --icon icon.ico
          --collect-data jsonschema_specifications --hidden-import pypdf
          deskagent.py
      - name: Add the llama.cpp engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release names change over time, so look through recent releases for a plain
          # Windows x64 CPU build rather than assuming a file name.
          $releases = gh api "repos/ggml-org/llama.cpp/releases?per_page=40" | ConvertFrom-Json
          Write-Host "Latest release assets:"; $releases[0].assets | ForEach-Object { Write-Host "  $($_.name)" }
          $asset = $null
          foreach ($r in $releases) {
            $asset = $r.assets | Where-Object {
              $_.name -like '*.zip' -and $_.name -match 'win' -and $_.name -match 'x64' -and $_.name -match '(cpu|avx2)' -and
              $_.name -notmatch '(cuda|cudart|vulkan|sycl|hip|opencl|kompute|arm64)'
            } | Select-Object -First 1
            if ($asset) { Write-Host "Using $($r.tag_name): $($asset.name)"; break }
          }
          if (-not $asset) { throw "No Windows x64 CPU build of llama.cpp found in recent releases" }
          Invoke-WebRequest $asset.browser_download_url -OutFile llama.zip
          Expand-Archive llama.zip -DestinationPath llama_tmp -Force
          $exe = Get-ChildItem llama_tmp -Recurse -Filter llama-server.exe | Select-Object -First 1
          if (-not $exe) { throw "llama-server.exe not found in $($asset.name)" }
          New-Item -ItemType Directory -Force dist\DeskAgent\llama | Out-Null
          Copy-Item (Join-Path $exe.DirectoryName '*') dist\DeskAgent\llama -Recurse -Force
          & dist\DeskAgent\llama\llama-server.exe --version
          if ($LASTEXITCODE -ne 0) { throw "llama-server.exe would not run" }
          exit 0
      - name: Install Inno Setup
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=2.0.${{ github.run_number }}" installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: DeskAgent-Setup
          path: dist/DeskAgent-Setup.exe
      - name: Publish installer to the installer branch
        # Gives a permanent download link: github.com/<owner>/<repo>/raw/installer/DeskAgent-Setup.exe
        if: github.ref == 'refs/heads/main'
        run: |
          New-Item -ItemType Directory -Force publish | Out-Null
          Copy-Item dist\DeskAgent-Setup.exe publish\
          Set-Location publish
          git init -b installer
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DeskAgent-Setup.exe
          git commit -m "Installer built from ${{ github.sha }}"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" installer
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DeskAgent-Setup.exe

name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check it imports
        run: python -c "import deskagent"
      - name: Build app
        # A folder build starts faster than a single file EXE; the installer wraps it up.
        run: >
          pyinstaller --noconfirm --onedir --windowed --name DeskAgent
          --icon icon.ico
          --collect-data jsonschema_specifications
          deskagent.py
      - name: Add the llama.cpp engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = gh release view --repo ggml-org/llama.cpp --json tagName --jq .tagName
          Write-Host "Using llama.cpp $tag"
          gh release download $tag --repo ggml-org/llama.cpp --pattern "*bin-win-cpu-x64.zip" --dir llama_zip
          if (-not (Get-ChildItem llama_zip -ErrorAction SilentlyContinue)) {
            gh release download $tag --repo ggml-org/llama.cpp --pattern "*bin-win-avx2-x64.zip" --dir llama_zip
          }
          Expand-Archive (Get-ChildItem llama_zip\*.zip | Select-Object -First 1).FullName -DestinationPath llama_tmp -Force
          $exe = Get-ChildItem llama_tmp -Recurse -Filter llama-server.exe | Select-Object -First 1
          if (-not $exe) { throw "llama-server.exe not found in the llama.cpp download" }
          New-Item -ItemType Directory -Force dist\DeskAgent\llama | Out-Null
          Copy-Item (Join-Path $exe.DirectoryName '*') dist\DeskAgent\llama -Recurse -Force
          & dist\DeskAgent\llama\llama-server.exe --version
          if ($LASTEXITCODE -ne 0) { throw "llama-server.exe would not run" }
      - name: Install Inno Setup
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=2.0.${{ github.run_number }}" installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: DeskAgent-Setup
          path: dist/DeskAgent-Setup.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DeskAgent-Setup.exe

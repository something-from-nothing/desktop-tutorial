name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check it imports
        run: python -c "import deskagent"
      - name: Build app
        # A folder build starts faster than a single file EXE; the installer wraps it up.
        run: >
          pyinstaller --noconfirm --onedir --windowed --name DeskAgent
          --icon icon.ico
          --collect-data jsonschema_specifications
          deskagent.py
      - name: Install Inno Setup
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=1.0.${{ github.run_number }}" installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: DeskAgent-Setup
          path: dist/DeskAgent-Setup.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DeskAgent-Setup.exe

name: Build iPad web app

on:
  push:
    branches: [main]
    paths: ["ipad/**", "android/app/src/main/assets/index.html", ".github/workflows/build-ipad.yml"]
  workflow_dispatch:

permissions:
  contents: write

# One build at a time: a newer push replaces a waiting one, so two builds never race
# to save their files (that failed a build once).
concurrency:
  group: build-ipad
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the site
        run: ipad/build.sh
      # The site goes on the ipad-site branch. githack serves a public repo's files as
      # web pages, so it opens at
      # https://raw.githack.com/<owner>/<repo>/ipad-site/index.html with no Pages setup.
      - name: Publish to the ipad-site branch
        if: github.ref == 'refs/heads/main'
        run: |
          cd ipad/site
          git init -b ipad-site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "iPad web app built from ${{ github.sha }}"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ipad-site
